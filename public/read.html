<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hebrew reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Hebrew reader</a>
  <nav><a href="/">Articles</a><a class="active" href="#">Read</a></nav>
  <span class="spacer"></span>
  <div class="legend">
    <span><i class="sw-shaky"></i>shaky on your map</span>
    <span><i class="sw-new"></i>met, not yet marked</span>
    <span><i class="sw-solid"></i>solid or never met</span>
  </div>
</header>
<div class="reader">
  <main class="article-col">
    <div class="article-meta" id="meta"></div>
    <h1 class="headline" id="headline"></h1>
    <div class="body" id="body"></div>
    <p class="msg" id="page-msg"></p>
  </main>
  <aside class="side">
    <div class="card-slot">
      <section class="card idle" id="card-desktop" data-template="card">
        <div class="head"><div class="surface"></div><div class="status">hover on a word</div></div>
        <div class="line meaning"></div>
        <div class="line grammar"></div>
        <div class="chips"></div>
        <div class="note"></div>
        <div class="error"></div>
        <div class="actions">
          <button class="btn primary" data-act="shaky">Save to vocab</button>
          <button class="btn" data-act="solid">Mark solid</button>
          <button class="btn" data-act="ask">Ask about this root</button>
        </div>
        <div class="foot"></div>
      </section>
    </div>
    <section>
      <h2>This piece against your map</h2>
      <div class="side-list" id="side-list"></div>
      <p class="empty" id="side-empty">No word here is on your map yet.</p>
    </section>
  </aside>
</div>
<div class="sheet-holder">
  <section class="card sheet idle" id="card-phone">
    <div class="head"><div class="surface"></div><div class="status"></div><button class="close" aria-label="Close">×</button></div>
    <div class="line meaning"></div>
    <div class="line grammar"></div>
    <div class="chips"></div>
    <div class="note"></div>
    <div class="error"></div>
    <div class="actions">
      <button class="btn primary" data-act="shaky">Save to vocab</button>
      <button class="btn" data-act="solid">Mark solid</button>
      <button class="btn" data-act="ask">Ask about this root</button>
    </div>
    <div class="foot"></div>
  </section>
</div>
<script src="/tokenize.js"></script>
<script src="/reader.js"></script>
<script src="/card-ui.js"></script>
<script src="/card.js"></script>
</body>
</html>
