<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson sheet — Hebrew reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap">
<style>
  /* A print-clean sheet: no chrome, serif Hebrew, A4/Letter margins. It
     prints, so it stays light whatever the device or the switch says; the
     declaration below is what stops a browser darkening it by itself. */
  :root { color-scheme: only light; }
  /* A print-clean sheet: no chrome, serif Hebrew, A4/Letter margins. */
  @page { size: A4; margin: 18mm 16mm; }
  :root { --text: #1f1e1a; --muted: #55524a; --line: #c9c3b4; --serif: 'Frank Ruhl Libre', 'David', 'Narkisim', 'Times New Roman', serif; --sans: 'Assistant', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--text); font-family: var(--sans); font-size: 12pt; }
  .sheet { max-width: 180mm; margin: 0 auto; padding: 18mm 16mm; }
  @media screen and (max-width: 600px) { .sheet { padding: 20px 16px; } }
  h1 { font-size: 18pt; margin: 0 0 4pt; font-weight: 700; }
  .articles { font-size: 10pt; color: var(--muted); margin: 0 0 6pt; line-height: 1.5; }
  .articles .he { direction: rtl; unicode-bidi: isolate; font-family: var(--serif); font-size: 11.5pt; color: var(--text); }
  .lead { font-size: 10.5pt; color: var(--muted); margin: 0 0 14pt; }
  h2 { font-size: 11pt; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 3pt; margin: 16pt 0 8pt; break-after: avoid; }
  .item { display: grid; grid-template-columns: 1fr 1fr; gap: 4pt 14pt; padding: 6pt 0 8pt; border-bottom: 1px dotted var(--line); break-inside: avoid; }
  .item .surfaces { grid-column: 1 / -1; direction: rtl; text-align: right; font-family: var(--serif); font-size: 17pt; font-weight: 700; line-height: 1.3; }
  .item .grammar { font-size: 10.5pt; }
  .item .meaning { font-size: 10.5pt; }
  .item .sentence { grid-column: 1 / -1; direction: rtl; text-align: right; font-family: var(--serif); font-size: 12.5pt; line-height: 1.6; }
  .item .from { grid-column: 1 / -1; font-size: 9pt; color: var(--muted); }
  .item .from .he { direction: rtl; unicode-bidi: isolate; font-family: var(--serif); font-size: 10pt; }
  .item .status { grid-column: 1 / -1; font-size: 9.5pt; color: var(--muted); }
  .he { direction: rtl; unicode-bidi: isolate; font-family: var(--serif); font-size: 12pt; }
  .none, .error { font-size: 11pt; margin: 0; }
  .error { color: #8a3b2a; }
  .write { grid-column: 1 / -1; height: 22pt; border-bottom: 1px solid var(--line); }
  @media print { .write { height: 26pt; } }
  /* ?lesson=<id>: the study guide of a lesson from Guy, for the reMarkable */
  .hidden { display: none; }
  .guide section { margin: 0 0 12pt; }
  .guide h3 { font-size: 13pt; margin: 14pt 0 6pt; border-bottom: 1px solid var(--line); padding-bottom: 3pt; unicode-bidi: plaintext; break-after: avoid; }
  .guide p { margin: 0 0 5pt; font-size: 11pt; line-height: 1.5; }
  .guide .prose, .guide .why, .guide .note, .guide .flags, .guide .paper-title { unicode-bidi: plaintext; white-space: pre-line; }
  .guide .he { font-size: 13pt; }
  .guide ul, .guide ol { margin: 0 0 6pt; padding-inline-start: 1.4em; font-size: 11pt; }
  .guide li { margin-bottom: 3pt; }
  .guide .examples, .guide .answers { list-style: none; padding: 0; }
  .guide .en, .guide .muted, .guide .cue, .guide .lead { font-size: 9.5pt; color: var(--muted); }
  .guide .label { font-size: 8.5pt; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
  .guide .drill { border: 1px solid var(--line); padding: 6pt 8pt; margin-bottom: 8pt; break-inside: avoid; }
  .guide .drill-verb { font-size: 16pt; font-weight: 700; margin-inline-end: 8pt; }
  .guide .conj { display: grid; grid-template-columns: repeat(auto-fill, minmax(38mm, 1fr)); gap: 5pt; margin: 4pt 0; }
  .guide .tense { border: 1px dotted var(--line); padding: 3pt 5pt; }
  .guide .forms { margin: 2pt 0 0; display: grid; grid-template-columns: auto 1fr; gap: 1pt 6pt; }
  .guide .forms dt { font-size: 8.5pt; color: var(--muted); }
  .guide .forms dd { margin: 0; text-align: right; }
  .guide .exercises .sentence, .guide .examples .he, .guide .questions li { text-align: right; }
  .guide .exercises li { margin-bottom: 8pt; }
  .guide .paper-prompt { margin-bottom: 6pt; }
  .guide .paper-title { font-weight: 700; font-size: 11pt; }
  .guide table.vocab { border-collapse: collapse; width: 100%; font-size: 10pt; }
  .guide .vocab th { text-align: start; font-size: 8.5pt; color: var(--muted); border-bottom: 1px solid var(--line); padding: 3pt; }
  .guide .vocab td { border-bottom: 1px dotted var(--line); padding: 3pt; vertical-align: top; }
  .guide .vocab td.he { text-align: right; }
  .guide .questions { direction: rtl; }
  .guide .questions li { margin-bottom: 14pt; }
  .guide .expression { border-bottom: 1px dotted var(--line); padding-bottom: 4pt; margin-bottom: 5pt; break-inside: avoid; }
  .guide .expr-he { font-weight: 700; margin-inline-end: 8pt; }
  .guide .drill-head, .guide .expr-head { display: flex; gap: 8pt; flex-wrap: wrap; align-items: baseline; }
  .guide .caption { display: none; }
</style>
</head>
<body>
<main class="sheet hidden" id="lesson-sheet">
  <h1 id="lesson-title" dir="auto"></h1>
  <p class="articles" id="lesson-meta"></p>
  <div class="guide" id="lesson-guide"></div>
  <p class="error" id="lesson-error"></p>
</main>
<main class="sheet" id="sheet">
  <h1>Lesson sheet</h1>
  <p class="articles" id="articles"></p>
  <p class="lead" id="lead"></p>
  <div id="groups"></div>
  <p class="none hidden" id="none"></p>
  <p class="error" id="error"></p>
</main>
<script src="/guide-ui.js"></script>
<script>
'use strict';
// ?lesson=<id>: the study guide of that lesson from Guy instead of the sheet
// made from recent reading.
(async function () {
  const $ = (s) => document.querySelector(s);
  const id = new URLSearchParams(location.search).get('lesson');
  if (!id) return;
  $('#sheet').classList.add('hidden');
  $('#lesson-sheet').classList.remove('hidden');
  try {
    const res = await fetch(`/lessons/${encodeURIComponent(id)}`, { headers: { accept: 'application/json' } });
    if (res.status === 401) { location.href = '/login'; return; }
    const v = await res.json();
    if (!res.ok) throw new Error(v.error || `The server answered ${res.status}.`);
    document.title = `${v.title} — study guide`;
    $('#lesson-title').textContent = v.title;
    $('#lesson-meta').textContent = `Study guide · ${v.items.length} items · ${v.source_name}`;
    if (!v.guide) throw new Error('The study guide for this lesson is not built yet; open the lesson first.');
    window.GuideUI.render($('#lesson-guide'), v.guide, { print: true });
  } catch (e) {
    $('#lesson-error').textContent = e.message;
  }
})();
(async function () {
  const $ = (s) => document.querySelector(s);
  if (new URLSearchParams(location.search).get('lesson')) return;
  const n = new URLSearchParams(location.search).get('articles') || '';
  const he = (t) => { const s = document.createElement('span'); s.className = 'he'; s.textContent = t; return s; };
  let data;
  try {
    const res = await fetch(`/make/lesson?articles=${encodeURIComponent(n)}&format=json`, { headers: { accept: 'application/json' } });
    if (res.status === 401) { location.href = '/login'; return; }
    data = await res.json();
    if (!res.ok) throw new Error(data.error || `The server answered ${res.status}.`);
  } catch (e) {
    $('#error').textContent = e.message;
    return;
  }
  document.title = `Lesson sheet — ${data.articles.length} recent article${data.articles.length === 1 ? '' : 's'}`;
  const arts = $('#articles');
  if (!data.articles.length) arts.textContent = 'Articles: none stored yet.';
  else {
    arts.append(document.createTextNode(`From ${data.articles.length} recent article${data.articles.length === 1 ? '' : 's'}: `));
    data.articles.forEach((a, i) => {
      if (i) arts.append(document.createTextNode(' · '));
      arts.append(he(a.title), document.createTextNode(` (${a.date})`));
    });
  }
  if (!data.count) {
    $('#lead').textContent = '';
    $('#none').classList.remove('hidden');
    $('#none').textContent = `Nothing qualifies: no word was seen ${data.min_touches} or more times in these articles.`;
    return;
  }
  $('#lead').textContent = `Words you've seen ${data.min_touches} or more times, Nif'al first. A line under each to write the form.`;
  const groups = $('#groups');
  for (const g of data.groups) {
    const h = document.createElement('h2'); h.textContent = g.title; groups.append(h);
    for (const i of g.items) {
      const it = document.createElement('section'); it.className = 'item';
      const s = document.createElement('div'); s.className = 'surfaces'; s.textContent = i.surfaces.join(' · '); it.append(s);
      const gr = document.createElement('div'); gr.className = 'grammar';
      const bits = [];
      if (i.lemma) bits.push(['lemma ', he(i.lemma)]);
      if (i.root) bits.push(['root ', he(i.root)]);
      if (i.binyan_label) bits.push([i.binyan_label]);
      if (i.governs) bits.push(['governs ', he(i.governs)]);
      bits.forEach((b, k) => { if (k) gr.append(document.createTextNode(' · ')); for (const x of b) gr.append(typeof x === 'string' ? document.createTextNode(x) : x); });
      it.append(gr);
      const m = document.createElement('div'); m.className = 'meaning'; m.textContent = i.meaning_en || '(no card on record)'; it.append(m);
      const sen = document.createElement('div'); sen.className = 'sentence'; sen.textContent = i.sentence || '(no sentence on record)'; it.append(sen);
      if (i.sentence_article) { const f = document.createElement('div'); f.className = 'from'; f.append(document.createTextNode('from '), he(i.sentence_article)); it.append(f); }
      const st = document.createElement('div'); st.className = 'status'; st.textContent = `${i.status} · ${i.touches === 1 ? 'seen once' : `seen ${i.touches} times`}`; it.append(st);
      const w = document.createElement('div'); w.className = 'write'; it.append(w);
      groups.append(it);
    }
  }
})();
</script>
</body>
</html>
