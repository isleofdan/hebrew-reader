<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hebrew reader · Look up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Serif+Hebrew:wght@400;500;600&display=swap">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<script src="/sentry.min.js"></script>
<script src="/crash.js"></script>
<script src="/theme.js"></script>
<script src="/install.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Hebrew reader</a>
  <nav><a href="/">Articles</a><a class="phone" href="/phone">phone</a><a href="/desk">Desk</a><a class="active" href="/lookup">Look up</a><a href="/today">Today</a><a href="/walks">Walks</a><a href="/study">Study</a></nav>
  <span class="spacer"></span>
  <div class="theme" role="group" aria-label="Theme">
    <button type="button" data-theme-choice="light">Light</button>
    <button type="button" data-theme-choice="dark">Dark</button>
    <button type="button" data-theme-choice="device">Device</button>
  </div>
  <a href="/logout" style="font-size:13px;color:var(--muted)">Sign out</a>
</header>
<main class="page lookup-page">

  <section class="panel lookup-search">
    <form id="search" autocomplete="off">
      <label for="word" class="visually-hidden">A word to look up</label>
      <input id="word" type="search" dir="auto" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="A Hebrew word, or an English one">
      <button class="btn primary" id="go" type="submit">Look up</button>
    </form>
    <p class="mic-line" id="mic-line" role="status"></p>
    <p class="msg" id="search-msg"></p>
  </section>

  <section class="panel lookup-english hidden" id="english">
    <div class="en-spacer" id="en-spacer" aria-hidden="true"></div>
    <button type="button" class="en-fold hidden" id="en-fold"><span class="en-fold-title"></span> · <span class="en-back">Back to the list</span></button>
    <div class="en-list" id="en-list">
      <h2 class="en-title">Hebrew words for <span id="en-text"></span></h2>
      <p class="msg" id="en-msg"></p>
      <div class="en-groups" id="en-groups"></div>
    </div>
    <div class="en-pane hidden" id="en-pane"></div>
  </section>

  <section class="panel lookup-phrase hidden" id="phrase">
    <div class="en-spacer" id="ph-spacer" aria-hidden="true"></div>
    <button type="button" class="en-fold hidden" id="ph-fold"><span class="ph-fold-title" dir="rtl" lang="he"></span> · <span class="en-back">Back to the phrase</span></button>
    <div class="ph-body" id="ph-body">
      <h2 class="ph-text" id="ph-text" dir="rtl" lang="he"></h2>
      <h3 class="ph-head">What it means</h3>
      <p class="ph-meaning" id="ph-meaning"></p>
      <p class="ph-literal" id="ph-literal"></p>
      <p class="ph-note" id="ph-note"></p>
      <p class="ph-source" id="ph-source">Meaning from the model; no dictionary was asked</p>
      <h3 class="ph-head">Look up each word</h3>
      <div class="ph-words" id="ph-words" dir="rtl"></div>
      <div class="keep" id="ph-keep"></div>
    </div>
  </section>

  <section class="panel lookup-entry hidden" id="entry">
    <p class="saved-line" id="saved-line"></p>
    <section class="card idle" id="card-lookup">
      <div class="head"><div class="surface"></div><span class="rec-slot" id="card-rec"></span><div class="status"></div></div>
      <div class="line meaning"></div>
      <div class="line grammar"></div>
      <div class="chips"></div>
      <div class="note"></div>
      <div class="corrected"></div>
      <div class="error"></div>
      <div class="actions">
        <button class="btn primary" data-act="shaky">Save to vocab</button>
        <button class="btn" data-act="solid">Mark solid</button>
        <button class="btn" data-act="ask">Ask about this root</button>
      </div>
      <div class="foot"></div>
    </section>
    <div class="refused hidden" id="refused">
      <h3 class="dym-title" id="dym-title">Did you mean</h3>
      <div class="dym" id="dym"></div>
      <div class="keep" id="word-keep"></div>
    </div>
    <p class="looked-line" id="looked-line"></p>
    <div class="lookup-tabs" id="tabs" role="group" aria-label="Look it up in"></div>
    <div class="ref-pane hidden" id="pane"></div>
  </section>

  <section class="panel lookup-list" id="looked">
    <div class="panel-head">
      <h2>Looked up</h2>
      <button class="btn small primary" id="put" type="button" disabled>Put on a desk</button>
    </div>
    <p class="msg" id="put-msg" role="status"></p>
    <ol class="looked" id="looked-list"></ol>
    <p class="empty" id="looked-empty">The words you look up here will be listed here, newest first.</p>
    <button class="btn small" id="more" type="button" hidden>Show more</button>
  </section>
  <div class="en-tail" id="en-tail" aria-hidden="true"></div>

</main>
<script src="/card-ui.js"></script>
<script src="/reference-ui.js"></script>
<script src="/ask-ui.js"></script>
<script src="/delete-ui.js"></script>
<script src="/mic-ui.js"></script>
<script src="/lookup.js"></script>
</body>
</html>
